version: 1
# Agent Bundler is one binary with one owner. Module distance follows code
# structure. Volatility describes the domain contract: target adapters change
# with vendor formats; artifact writing is stable infrastructure.
owners:
  - alexei-led
builtin:
  graph: deny
  duplication: off
# Inner to outer. The layers rule rejects an inner module depending on an outer one.
layers:
  - model
  - stage
  - compiler
  - cmd
languages:
  go:
    enabled: true
  # The Pi hook runtime is a contained TypeScript island below
  # internal/target/pi/runtime and remains part of the target module.
  typescript:
    enabled: true
  python:
    enabled: false
  rust:
    enabled: false
analyzers:
  syntax:
    enabled: true
modules:
  agentplugins:
    paths:
      - internal/agentplugins/**
    public:
      - internal/agentplugins
    layer: model
    subdomain: core
    volatility: high
  compiler_model:
    paths:
      - internal/compiler/model/**
    public:
      - internal/compiler/model
    layer: model
    subdomain: core
    volatility: high
  composition:
    paths:
      - internal/compiler/composition/**
    public:
      - internal/compiler/composition
    layer: stage
    subdomain: core
    volatility: high
    depends_on:
      - compiler_model
  source:
    paths:
      - internal/compiler/source/**
    public:
      - internal/compiler/source
    layer: stage
    subdomain: core
    volatility: high
    depends_on:
      - compiler_model
      - agentplugins
  target:
    paths:
      - internal/target/**
    public:
      - internal/target
    layer: stage
    subdomain: core
    volatility: high
    depends_on:
      - compiler_model
      - agentplugins
  artifact:
    paths:
      - internal/artifact/**
    public:
      - internal/artifact
    layer: stage
    subdomain: supporting
    volatility: medium
    depends_on:
      - compiler_model
  compatibility:
    paths:
      - internal/compatibility/**
    public:
      - internal/compatibility
    layer: stage
    subdomain: supporting
    volatility: high
    depends_on:
      - compiler_model
  compiler:
    paths:
      - internal/compiler/*.go
    public:
      - internal/compiler
    layer: compiler
    subdomain: core
    volatility: high
    depends_on:
      - compiler_model
      - composition
      - source
      - target
      - artifact
      - compatibility
      - buildinfo
      - agentplugins
  cmd_agentbundler:
    paths:
      - cmd/agbun/**
    public:
      - cmd/agbun
    layer: cmd
    subdomain: generic
    volatility: medium
    depends_on:
      - compiler
      - compiler_model
      - artifact
      - buildinfo
      - agentplugins
  buildinfo:
    paths:
      - internal/buildinfo/**
    public:
      - internal/buildinfo
    subdomain: generic
    volatility: low
  testutil:
    paths:
      - internal/testutil/**
    public:
      - internal/testutil
    subdomain: generic
    volatility: low
  root:
    paths:
      - "*.go"
    public:
      - "*.go"
    subdomain: generic
    volatility: low
tests:
  - "**/*_test.go"
  - "**/*.{test,spec}.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
  - "**/test/**"
  - "**/testdata/**"
