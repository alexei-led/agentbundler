name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  ANTIGRAVITY_CLI_SHA256: 7a7239a69b65d3cf3af7e75f27b2ff4e9cce696a7b9a9e5c37c695f1c74eec34
  ANTIGRAVITY_CLI_VERSION: 1.1.3
  ARCHFIT_VERSION: v1.6.0
  ARCHFIT_VERSION_CHECK: "1"
  AST_GREP_VERSION: 0.44.0
  BUN_VERSION: 1.3.14
  CLAUDE_CODE_VERSION: 2.1.210
  GROK_BUILD_SHA256: 2556299cded37f81e54c02420cfa7f1a2df9feab72a445869a0f5596e143b333
  GROK_BUILD_VERSION: 0.2.101
  JSCPD_VERSION: 5.0.11
  NODE_VERSION: "24"
  SCIP_GO_VERSION: v0.2.7
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install architecture tools
        # zizmor: ignore[adhoc-packages] pinned CI-only analyzers are not app dependencies
        run: |
          go install -ldflags "-X main.version=${ARCHFIT_VERSION}" \
            "github.com/alexei-led/archfit/cmd/archfit@${ARCHFIT_VERSION}"
          go install "github.com/scip-code/scip-go/cmd/scip-go@${SCIP_GO_VERSION}"
          npm install --global \
            "@ast-grep/cli@${AST_GREP_VERSION}" \
            "jscpd@${JSCPD_VERSION}"
      - name: Check formatting
        run: |
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          test -z "$(gofmt -l "${go_files[@]}")"
          git diff --check
      - name: Test Go
        run: go test ./...
      - name: Compile vendor smoke tests
        run: go test -run '^$' -tags=vendor_smoke ./...
      - name: Test Go race detector
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Test Pi runtime
        working-directory: internal/target/pi/runtime
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - name: Check deterministic seven-target fixture
        run: scripts/check-acceptance-fixture
      - name: Check deterministic Agent Plugins fixture
        run: scripts/check-agent-plugins-fixture
      - name: Check architecture
        run: scripts/check-architecture
      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
  windows-artifacts:
    name: Windows artifact contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Windows artifact behavior
        run: go test ./internal/artifact/...
  safe-validators:
    name: Pinned safe vendor validators
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned validators
        # zizmor: ignore[adhoc-packages] official validator versions and downloaded bytes are pinned
        run: |
          set -euo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          curl --fail --silent --show-error --location \
            --output /tmp/grok \
            "https://x.ai/cli/grok-${GROK_BUILD_VERSION}-linux-x86_64"
          printf '%s  %s\n' "$GROK_BUILD_SHA256" /tmp/grok | sha256sum --check --strict
          install -m 0755 /tmp/grok /usr/local/bin/grok
          antigravity_archive=/tmp/agy_cli_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            --output "$antigravity_archive" \
            "https://github.com/google-antigravity/antigravity-cli/releases/download/${ANTIGRAVITY_CLI_VERSION}/agy_cli_linux_x64.tar.gz"
          printf '%s  %s\n' "$ANTIGRAVITY_CLI_SHA256" "$antigravity_archive" | sha256sum --check --strict
          mkdir /tmp/antigravity-cli
          tar --extract --gzip --file "$antigravity_archive" \
            --directory /tmp/antigravity-cli antigravity
          install -m 0755 /tmp/antigravity-cli/antigravity /usr/local/bin/agy
          test "$(agy --version)" = "$ANTIGRAVITY_CLI_VERSION"
      - name: Build acceptance fixture
        run: go run ./cmd/agbun build --root testdata/cc-thingz-hooks
      - name: Run official non-mutating validators
        env:
          HOME: ${{ runner.temp }}/vendor-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/vendor-home/.claude
          XDG_CONFIG_HOME: ${{ runner.temp }}/vendor-home/.config
          XDG_CACHE_HOME: ${{ runner.temp }}/vendor-home/.cache
          TMPDIR: ${{ runner.temp }}/vendor-tmp
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          set -euo pipefail
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$TMPDIR"
          claude plugin validate --strict testdata/cc-thingz-hooks/generated/claude
          grok plugin validate testdata/cc-thingz-hooks/generated/grok/core-tools
          grok plugin validate testdata/cc-thingz-hooks/generated/grok/workflow-tools
          agy plugin validate testdata/cc-thingz-hooks/generated/antigravity/core-tools
          agy plugin validate testdata/cc-thingz-hooks/generated/antigravity/workflow-tools
